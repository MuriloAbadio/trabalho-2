<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Digital Solutions</title>
  <link rel="stylesheet" href="contato.css">
</head>
<body>

  <!-- CTA + FORMULÁRIO -->
  <section class="contato" id="contato">
    <h2>Pronto para tirar seu projeto do papel?</h2>

    <form class="form" action="#contato" method="get">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Nome" required>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="E-mail" required>
      </div>

      <div class="campo">
        <label for="telefone">Telefone/WhatsApp</label>
        <input type="tel" id="telefone" name="telefone" placeholder="Telefone/WhatsApp">
      </div>

      <div class="campo">
        <label for="servico">Tipo de Serviço</label>
        <select id="servico" name="servico" required>
          <option value="" selected disabled>Tipo de Serviço</option>
          <option value="app">Aplicativo</option>
          <option value="site">Site</option>
          <option value="design">Design/Layout</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div class="campo largo">
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Mensagem"></textarea>
      </div>

      <button type="submit" class="btn-enviar">Falar com um Especialista</button>
    </form>
  </section>

  <!-- RODAPÉ -->
  <footer class="rodape">
    <div class="rodape-topo">
      <ul class="contatos">
        <li>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
            <path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7L4.5 7v1.6L12 13.6l7.5-5V7L12 12z"/>
          </svg>
          <a href="mailto:email@digitalsolutions.com">email@digitalsolutions.com</a>
        </li>
        <li>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" fill="#fff"/>
            <path fill="#0f1b33" d="M8 8c0 4 4 8 8 8l1-2-2.5-1-1 1c-1.5-.5-2.5-1.5-3-3l1-1L10.5 7z"/>
          </svg>
          <a href="https://wa.me/5500000000000">WhatsApp: wa.me/digitalsolutions</a>
        </li>
        <li class="redes">
          <a href="#" aria-label="GitHub">gh</a>
          <a href="#" aria-label="LinkedIn">in</a>
          <a href="#" aria-label="Instagram">ig</a>
          <a href="#" aria-label="YouTube">yt</a>
        </li>
      </ul>

      <nav class="links" aria-label="Navegação do rodapé">
        <a href="index.html">Home</a>
        <a href="#sobre">Sobre</a>
        <a href="#servicos">Serviços</a>
        <a href="index.html#portfolio">Portfólio</a>
        <a href="#contato">Contato</a>
      </nav>
    </div>

    <p class="copy">© 2024 Digital Solutions. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
