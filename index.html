<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Exemplo HTML</title>
</head>
<body>
    <!-- Cabeçalho principal -->
    <h1>Olá, Mundo! (Hello World)</h1>

    <!-- Parágrafo de texto -->
    <p>Este é um exemplo básico estruturado com as principais tags do <strong>HTML</strong>.</p>

    <!-- Lista com itens -->
    <ul>
        <li>Item 1: Estrutura</li>
        <li>Item 2: Semântica</li>
        <li>Item 3: Navegador</li>
    </ul>

    <!-- Link de exemplo -->
    <p>Aprenda mais na <a href="https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Core/Structuring_content/Basic_HTML_syntax" target="_blank">MDN Web Docs</a>.</p>
</body>
</html>
